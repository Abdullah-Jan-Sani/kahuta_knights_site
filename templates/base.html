<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}Kahuta Knights Armwrestling{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='images/KahutaKnights.png') }}">
</head>
<body>

<div class="page-bg"></div>

<header class="site-header">
  <a href="{{ url_for('home') }}" class="brand">
    <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Kahuta Knights Crest" class="brand-crest">
    <span class="brand-name">KAHUTA <em>KNIGHTS</em></span>
  </a>

  <input type="checkbox" id="nav-toggle" class="nav-toggle">
  <label for="nav-toggle" class="nav-burger" aria-label="Menu">
    <span></span><span></span><span></span>
  </label>

  <nav class="site-nav">
    <a href="{{ url_for('home') }}"      class="{{ 'active' if active=='home' else '' }}">Home</a>
    <a href="{{ url_for('events') }}"    class="{{ 'active' if active=='events' else '' }}">Events</a>
    <a href="{{ url_for('rankings') }}"  class="{{ 'active' if active=='rankings' else '' }}">Rankings</a>
    <a href="{{ url_for('team') }}"      class="{{ 'active' if active=='team' else '' }}">Team Members</a>
    <a href="{{ url_for('contact') }}"   class="{{ 'active' if active=='contact' else '' }}">Contact</a>
  </nav>
</header>

<main>
  {% block content %}{% endblock %}
</main>

<footer class="site-footer reveal">
  <div class="footer-crest">
    <img src="{{ url_for('static', filename='images/logo.jpg') }}" alt="Kahuta Knights">
  </div>
  <div class="footer-text">
    <p class="footer-motto">STRENGTH &nbsp;·&nbsp; HONOR &nbsp;·&nbsp; VICTORY</p>
    <p>&copy; {{ current_year }} Kahuta Knights Armwrestling Group. For inquiries: 03448583226</p>
  </div>
</footer>

<script>
  // Reveal-on-scroll with Intersection Observer
  (function () {
    const reveals = document.querySelectorAll('.reveal');
    if (!reveals.length) return;

    const observer = new IntersectionObserver(
      (entries) => {
        entries.forEach((entry) => {
          if (entry.isIntersecting) {
            entry.target.classList.add('visible');
            observer.unobserve(entry.target);
          }
        });
      },
      {
        threshold: 0.12,
        rootMargin: '0px 0px -40px 0px'
      }
    );

    reveals.forEach((el) => observer.observe(el));
  })();

  // Smooth header shadow on scroll
  (function () {
    const header = document.querySelector('.site-header');
    if (!header) return;

    let lastY = 0;
    window.addEventListener('scroll', () => {
      const y = window.scrollY;
      if (y > 30) {
        header.style.boxShadow = '0 4px 24px rgba(0,0,0,0.45)';
        header.style.borderBottomColor = 'rgba(212,175,55,0.4)';
      } else {
        header.style.boxShadow = 'none';
        header.style.borderBottomColor = 'rgba(212,175,55,0.25)';
      }
      lastY = y;
    }, { passive: true });
  })();
</script>

</body>
</html>
